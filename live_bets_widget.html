<!doctype html><html><head><meta charset="utf-8"><title>My Mac's Live Action Tracker</title><style>
*{box-sizing:border-box}html,body{width:100%;overflow-x:hidden}
body{margin:0;background:#0d0f14;color:#e8eaf0;font:15px -apple-system,Helvetica,sans-serif;-webkit-user-select:none}
h1{font-size:11px;margin:0;padding:10px 12px;color:#aab0c0;display:flex;justify-content:space-between;align-items:center;gap:8px;-webkit-app-region:drag;font-weight:700;letter-spacing:.2px}
h1 span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}h1 #t{font-weight:500;font-size:9.5px;color:#7d8394;white-space:nowrap}
#l{padding:0 8px 10px}
.hc{cursor:pointer;user-select:none}.hv{font-size:12px;letter-spacing:0;font-weight:700}.hv.g{color:#e6c45a}.hv.r{color:#e06c6c}.hs{display:flex;justify-content:space-between;font-size:9.5px;color:#6b7080;margin:-1px 4px 4px}.h{display:flex;justify-content:space-between;font-size:10px;color:#8a90a0;margin:10px 4px 3px;letter-spacing:.6px;font-weight:600}
.e{color:#8a90a0;text-align:center;padding:36px}
.b{position:relative;display:flex;gap:11px;width:100%;border-radius:12px;padding:9px 11px 9px 9px;margin:6px 0;border-left:5px solid #555;overflow:hidden}
.lc{flex:0 0 44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:2px 0;background:rgba(255,255,255,.28);border-radius:12px;align-self:stretch}
.lc img{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}.lc.two img{width:28px;height:28px}
.lc .x{font-size:13px;font-weight:700;border-radius:8px;padding:2px 8px}
.mc{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.r>.k .cb{margin-right:4px;font-size:8.5px;padding:1px 7px}.r>.f{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.r>.k{flex:0 0 auto;white-space:nowrap}
.n{font-weight:700;font-size:13px}.p{font-size:18.5px;font-weight:700;line-height:1}
.cf{font-size:14.5px;margin-right:4px;cursor:help;vertical-align:2px}
.w{position:absolute;top:0;right:0;font-size:7.5px;font-weight:700;letter-spacing:.4px;padding:2px 8px;border-radius:0 0 0 9px;background:#000;color:#fff}.w.g{color:#f5c542}
.b.hw .r1{padding-right:30px}
.sc{font-size:16px;font-weight:700;letter-spacing:.2px;line-height:1.15}.ck{font-size:9.5px;font-weight:600;opacity:.7;margin-left:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:6px;vertical-align:2px;box-shadow:0 0 0 1px #000}.dot.red{background:#ff2d2d}.dot.green{background:#22e06b}
.m{font-size:10.5px;font-weight:600}.m .lb{opacity:.65;font-weight:600;font-size:9.5px}.m .ar{opacity:.55;margin:0 3px}.m b{font-weight:700}.m .c{opacity:.55;font-size:9px;margin-left:5px}
.nw{padding:1px 7px;border-radius:8px;background:rgba(0,0,0,.18)}.nw.fl{background:#000;color:#fff}
.mv{font-size:9px;opacity:.7;font-weight:600}
.u{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:7px;background:rgba(0,0,0,.22)}
.pb{display:flex;align-items:center;gap:6px;justify-content:flex-start;padding:2px 0}.tr{width:84px;height:6px;border-radius:3px;background:rgba(0,0,0,.6);box-shadow:0 0 0 1px rgba(0,0,0,.35);overflow:hidden}.fil{height:100%;background:#fff;border-radius:2px}
.pt{font-size:10px;font-weight:700;white-space:nowrap}.tk{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.7);margin-left:3px;vertical-align:middle;background:rgba(0,0,0,.35)}.tk.on{background:#fff}
.cb{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.4px;color:#1a1204;padding:2px 9px;border-radius:10px;border:1.5px solid #2a1d00;background:linear-gradient(110deg,#ffd84d 0%,#fff6c2 45%,#ffcf33 60%,#e0a100 100%);box-shadow:0 0 0 1px #000,0 0 9px 2px rgba(255,240,160,.95);white-space:nowrap}
.w1 .x{background:#1a1204;color:#f5d36b}.l1 .x{background:#ef4444;color:#fff}
@media (max-width:330px){body{font-size:12px}.p{font-size:18px}.sc{font-size:14.5px}.lc{flex-basis:44px}.lc img{width:36px;height:36px}.lc.two img{width:30px;height:30px}.m{font-size:10px}.m .c{display:none}}
.r>.f:has(.cb),.r>.f:has(.pb){padding:3px 4px;margin:-3px -4px;overflow:visible}
</style></head><body>
<h1><span>🎯 My Mac's Live Action Tracker</span><span id="t">…</span></h1><div id="l"><div class="e">Loading…</div></div><script>
const U='https://api.github.com/repos/colemlrogalin-source/tv-home/contents/live_bets.json';
const sh=p=>{const k=Math.min(1,Math.abs(p-50)/50),L=88-66*k,h=p>=50?140:0;return `background:hsl(${h},${p>=50?55:65}%,${L}%);border-color:hsl(${h},70%,${Math.max(L-18,12)}%);color:${L>55?'#0b0d12':'#f2f4f8'}`};
const LK='background:linear-gradient(135deg,#0f5132,#0a3a24);border-color:#22e06b;color:#eafff2;box-shadow:0 0 0 1px #22e06b55,0 0 10px #22e06b33';
const G='background:linear-gradient(135deg,#f5d36b,#c9971c);border-color:#8a6408;color:#1a1204';
const $=v=>v==null?'—':'$'+Number(v).toFixed(2);
const LC=(b,top)=>{const l=b.logos||[];return `<div class="lc ${l.length>1?'two':''}">${top||''}${l.map(u=>`<img src="${u}" onerror="this.remove()">`).join('')}</div>`};
const WHO=b=>`<span class="w ${b.who=='Grok'?'g':''}">${b.who=='Grok'?'GROK':'COLE'}</span>`;
const UN=b=>`<span class="u">${b.units??''}u</span>`;
const PAY=(b,lbl,nc)=>`<span class="m"><span class="lb">Paid</span> <b>${$(b.cost)}</b><span class="ar">→</span><span class="nw ${b.cash_flag?'fl':''}"><span class="lb">${lbl}</span> <b>${$(b.cash_out)}</b></span>${b.entry_pct!=null&&!nc?`<span class="c">${b.entry_pct}c</span>`:''}</span>`;
const CB=t=>`<span class="cb">CASHED${t?' '+t:''}</span>`;
const HIT=b=>b.prop_kind&&b.prop_line!=null&&(b.prop_cur||0)>=b.prop_line;
const CBP=b=>CB(b.prop_kind=='td'?b.prop_cur+' TD':b.prop_kind=='rec'?b.prop_cur+' rec':b.prop_cur+' yds');
const PB=b=>{if(!b.prop_kind||b.prop_line==null)return '';const c=b.prop_cur||0,l=b.prop_line;
if(c>=l)return '';
if(b.prop_kind=='yds')return `<div class="pb"><div class="tr"><div class="fil" style="width:${Math.min(100,100*c/l)}%"></div></div><span class="pt">${c}/${l}</span></div>`;
const n=Math.min(l,12);let t='';for(let i=0;i<n;i++)t+=`<span class="tk ${i<c?'on':''}"></span>`;
return `<div class="pb"><span>${t}</span><span class="pt">${b.prop_kind=='td'?(c?'TD ✓':'TD'):c+'/'+l}</span></div>`};
const MV=b=>b.vs_recent!=null&&Math.abs(b.vs_recent)>=5?`<span class="mv">${b.vs_recent>0?'up':'down'} ${Math.abs(b.vs_recent)} in 5 min</span>`:'<span></span>';
const card=b=>`<div class="b hw" style="${(b.prop_kind&&b.prop_line!=null&&b.prop_cur>=b.prop_line&&b.side!='NO')?G:b.live_pct>=97?LK:sh(b.live_pct)}">${WHO(b)}${LC(b)}<div class="mc">
<div class="r r1"><span class="f n">${b.bet}</span><span class="k p">${b.cash_flag?`<span class="cf" title="${(b.cash_why||'').replace(/"/g,'')}">⚡</span>`:''}${b.live_pct}%</span></div>
<div class="r"><span class="f"><span class="sc">${b.game}</span>${b.redzone?`<span class="dot ${b.redzone}" title="Red zone"></span>`:''}<span class="ck">${b.clock}</span></span></div>
<div class="r"><span class="f">${PAY(b,b.cash_flag?'⚡ Cash out':'Now',HIT(b))}</span>${HIT(b)?`<span class="k">${CBP(b)}</span>`:''}</div>
<div class="r">${PB(b)?`<span class="f" style="display:flex">${PB(b)}</span>`:MV(b)}<span class="k">${UN(b)}</span></div></div></div>`;
const tcard=b=>{const W=b.result=='W';return `<div class="b hw ${W?'w1':'l1'}" style="${W?G:'background:#3a1215;border-color:#7f1d1d;color:#f2f4f8'}">${WHO(b)}${LC(b)}<div class="mc">
<div class="r r1"><span class="f n">${b.bet}</span></div>
<div class="r"><span class="f sc">${b.final||'Final'}</span><span class="k">${UN(b)}</span></div>
<div class="r"><span class="f">${PAY(b,W?'Won':'Got',1)}</span>${W?`<span class="k">${CB('')}</span>`:''}</div></div></div>`};
let LD=null,CL={};try{CL=JSON.parse(localStorage.getItem('lb_c')||'{}')}catch(e){}
function TG(k){CL[k]=!CL[k];try{localStorage.setItem('lb_c',JSON.stringify(CL))}catch(e){}if(LD)R(LD)}
function R(d){LD=d;const TD=d.today||[],W=TD.filter(b=>b.result!='L'),X=TD.filter(b=>b.result=='L'),L=d.bets.map(card).join('');
const ar=k=>'';
const won=W.reduce((a,b)=>a+(+b.cash_out||0)-(+b.cost||0),0).toFixed(2),lost=X.reduce((a,b)=>a+(+b.cost||0),0).toFixed(2);
document.getElementById('l').innerHTML=`<div class="h"><span>LIVE BETS · ${d.count}</span></div>`+(L||'<div class="e">No live bets right now</div>')+(W.length?`<div class="h hc" onclick="TG('w')"><span>TODAY · ${d.today_record}</span><span><span class="hv g">+$${won} won</span><span class="hv ${(won-lost)>=0?'g':'r'}"> · Net ${(won-lost)>=0?'+':'−'}$${Math.abs(won-lost).toFixed(2)}</span></span></div><div class="hs"><span>${d.today_u_wag??0}u wagered</span><span>${d.today_u_won??0}u returned</span></div>`+(CL.w?'':W.map(tcard).join('')):'')+(X.length?`<div class="h hc" onclick="TG('l')"><span>LOST TODAY · ${X.length}</span><span class="hv r">−$${lost} lost</span></div>`+(CL.l?'':X.map(tcard).join('')):'');}
async function go(){let wait=300;try{const r=await fetch(U+'?t='+Date.now(),{headers:{Accept:'application/vnd.github.raw'},cache:'no-store'});
const d=await r.json();wait=d.poll_sec||300;document.getElementById('t').textContent=d.as_of+' · '+d.count;
R(d);}
catch(e){document.getElementById('t').textContent='offline – retrying';wait=120}setTimeout(go,wait*1000)}go();
function FZ(){try{var z=Math.max(1,Math.min(3,window.innerWidth/260));document.documentElement.style.zoom=z.toFixed(3)}catch(e){}}window.addEventListener('resize',FZ);FZ();
</script></body></html>
