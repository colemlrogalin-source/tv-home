<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Live Bets"><meta name="theme-color" content="#0A0014"><link rel="icon" href="https://colemlrogalin-source.github.io/tv-home/icon.png?v=20261109c"><link rel="apple-touch-icon" sizes="180x180" href="https://colemlrogalin-source.github.io/tv-home/icon-180.png?v=20261109c"><title>Sports Quant Pocket</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#0A0014;color:#fff;font:18px/1.35 Inter,system-ui,-apple-system,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 20% 0%,#4A0080 0%,#0A0014 60%);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:440px;margin:0 auto;padding:12px 14px 28px}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;letter-spacing:2px;color:#00F0FF;text-shadow:0 0 8px #00F0FF,0 0 18px #00F0FF66}
.brand img{width:36px;height:36px;border-radius:10px}
.upd{margin:6px 0 0;font-size:13px;color:#fff9;text-align:center;line-height:1.3}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pair div{background:#12001F;border:1px solid #ffffff22;border-radius:12px;padding:8px 10px;text-align:center}
.pair span{display:block;font-size:13px;letter-spacing:1px;color:#fff9}
.pair b{font:900 24px/1.1 Impact,sans-serif}
.tabs{display:flex;gap:6px;margin:10px 0 6px}
.tabs button{flex:1;min-height:40px;border-radius:999px;border:1.5px solid #FFD700;background:transparent;color:#FFD700;font-weight:900;font-size:15px;font-family:inherit}
.tabs button.on{background:#FFD700;color:#0A0014}
.panel{margin-top:12px;border-radius:14px;background:#12001F;padding:10px 12px}
.cyan{border:1.5px solid #00F0FF}.pink{border:1.5px solid #FF2BD6}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:#00F0FF;font-weight:800;letter-spacing:1px;font-size:15px}
.hd span{letter-spacing:0;font-weight:600;color:#fff;font-size:15px}
.game{margin-top:8px;padding:8px;border-radius:12px;border:1px solid #ffffff18}
.gh{display:flex;align-items:center;gap:6px;color:#00F0FF;font-size:15px;font-weight:800}
.gh img{width:22px;height:22px;object-fit:contain}
.card{display:block;width:100%;padding:8px 10px;margin-top:6px;border-radius:10px;background:#1A0028;border:1px solid #ffffff22}
.t{font-size:16px;font-weight:700}.meta{font-size:14px;color:#fffB;margin-top:2px}
.sd{display:inline-block;font-weight:800;font-size:13px;padding:1px 6px;border-radius:8px;margin-right:5px;vertical-align:1px}
.sd.y{background:#39FF14;color:#0A0014}.sd.n{background:#FF3355;color:#fff}
.bar{height:6px;border-radius:4px;background:#ffffff22;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FFD700,#39FF14);width:0}
.stat{display:flex;justify-content:space-between;gap:8px;font-size:16px;padding:7px 0;border-top:1px solid #ffffff18}
.stat:first-child{border-top:0}
.more{width:100%;min-height:40px;margin-top:4px;background:transparent;border:0;color:#00F0FF;font-weight:800;font-size:16px;font-family:inherit}
.fine,.foot{font-size:13px;color:#fff8;text-align:center}
.foot{margin-top:8px}
.g{color:#39FF14}.r{color:#FF3355}.gold{color:#FFD700}
.copulse{display:inline-block;animation:copulse .7s ease}
@keyframes copulse{0%,100%{opacity:1}50%{opacity:.6;transform:scale(1.08)}}
.burst{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.burst i{position:absolute;left:50%;top:28%;font-style:normal;font-size:24px;animation:fly .9s ease-out forwards}
.card.flash-win{animation:cashBurst 1s ease}.card.flash-loss{animation:lossFade 1s ease}
@keyframes cashBurst{0%{background:#FFD700aa;box-shadow:inset 0 0 0 2px #FFD700}70%{background:#FFD70044}100%{background:#1A0028}}
@keyframes lossFade{0%{background:#7a1a28}100%{background:#1A0028}}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
@keyframes drop{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}80%{transform:translateY(var(--t));opacity:1}100%{opacity:0}}
@media (min-width:800px){body{padding-top:24px}}
</style></head><body><div class="wrap" id="app">Loading…</div><script>
const RAW_FEED='https://raw.githubusercontent.com/colemlrogalin-source/tv-home/feed/live_bets.json';
const U_FEED='https://api.github.com/repos/colemlrogalin-source/tv-home/contents/live_bets.json?ref=feed';
const U='https://api.github.com/repos/colemlrogalin-source/tv-home/contents/live_bets.json';
const RAW='https://colemlrogalin-source.github.io/tv-home/live_bets.json';
const sideOf=b=>String(b.side||'').toUpperCase()==='NO'?'NO':String(b.side||'').toUpperCase()==='YES'?'YES':'';
const ttl=b=>{let t=b.bet||'';if(sideOf(b))t=t.replace(/^\s*NO:\s*/i,'').replace(/^\s*NO\s+/i,'');return t||'no data'};
const PILL=b=>{const s=sideOf(b);return s?`<b class="sd ${s==='YES'?'y':'n'}">${s}</b>`:''};
const money=v=>v==null?'no data':(v>=0?'+$':'−$')+Math.abs(Number(v)).toFixed(2);
const num=v=>v==null?'no data':'$'+Number(v).toFixed(2);
let TAB='Live',ALL=false,LD=null,SEEN=false,WINS=new Set(),OPENIDS=null,FLASH=new Set(),PREVCO=null;
function sum(rows,fn){if(!rows.length||rows.some(b=>fn(b)==null))return null;return Math.round(rows.reduce((s,b)=>s+fn(b),0)*100)/100}
function openPnl(rows){return sum(rows,b=>b.cash_out==null||b.cost==null?null:b.cash_out-b.cost)}
function todayPnl(rows){return sum(rows,b=>b.result==='W'&&b.cash_out!=null&&b.cost!=null?b.cash_out-b.cost:b.result==='L'&&b.cost!=null?-b.cost:null)}
function closeness(b){if(b.remaining==null&&(b.current==null||b.line==null))return Infinity;return Math.abs(b.remaining!=null?b.remaining:b.line-b.current)}
function urgency(b){const c=String(b.clock||'');const pm=c.match(/(\d+)(?:st|nd|rd|th)/i);let period=pm?+pm[1]:0;if(/halftime/i.test(c))period=Math.max(period,2);const em=c.match(/end of\s+(\d+)/i);if(em)period=+em[1];let secs=9999;if(/halftime|end of/i.test(c))secs=0;else{const t=c.match(/(\d+):(\d+)/);if(t)secs=+t[1]*60+ +t[2];else{const s=c.match(/(\d+(?:\.\d+)?)\s*-/);if(s)secs=+s[1]}}return {period,secs}}
function groups(bets){const m=new Map();bets.forEach(b=>{const k=b.game||'no data';if(!m.has(k))m.set(k,[]);m.get(k).push(b)});return [...m.values()].sort((a,b)=>{if(TAB!=='Live')return String(a[0].start||'').localeCompare(String(b[0].start||''));const A=urgency(a[0]),B=urgency(b[0]);return (B.period-A.period)||(A.secs-B.secs)})}
function pid(b){return b.ticker||((b.bet||'')+'|'+(b.game||''))}
function nstat(v){return v==null?'':(Number(v)===parseInt(v,10)?String(parseInt(v,10)):String(v))}
function statLine(b){if(!('current' in b)&&!('line' in b)&&!('remaining' in b))return '';const cur=b.current,line=b.line,rem=b.remaining,lb=b.stat_label||'';if(cur==null||line==null)return '<div class="meta">stat n/a</div>';if(String(b.side||'').toUpperCase()==='NO')return `<div class="meta">Now ${nstat(cur)} ${lb} · ${nstat(rem)} left under ${nstat(line)}</div>`;const need=(rem!=null&&rem>0)?' · needs '+nstat(rem)+' more':'';return `<div class="meta">Now ${nstat(cur)} / ${nstat(line)} ${lb}${need}</div>`}
function card(b,flash){
 const bar=b.live_pct==null?'<div class="meta">win % no data</div>':`<div class="bar" title="${b.live_pct}%"><i style="width:${Math.max(0,Math.min(100,b.live_pct))}%"></i></div>`;
 const pulse=PREVCO!=null&&b.cash_out!=null&&PREVCO[pid(b)]!==undefined&&PREVCO[pid(b)]!==b.cash_out;
 return `<div class="card${flash?' flash':''}"><div class="t">${PILL(b)} ${ttl(b)}</div>${statLine(b)}${bar}<div class="meta">${b.live_pct==null?'':b.live_pct+'% · '}cost ${num(b.cost)} · cash out <b class="${b.cash_out==null?'':b.cash_out-(b.cost||0)>=0?'g':'r'}${pulse?' copulse':''}">${num(b.cash_out)}</b></div></div>`;
}
function gameBlock(rs){
 const b=rs[0],gl=rs.flatMap(x=>x.game_logos||[]),logos=[...new Set(gl.length?gl:rs.flatMap(x=>x.logos||[]))].slice(0,3).map(u=>`<img src="${u}" alt="" onerror="this.remove()">`).join('');
 const legs=rs.slice().sort((a,c)=>closeness(a)-closeness(c));
 return `<div class="game ${b.state==='in'?'live':''}"><div class="gh">${logos}<span>${b.game||'no data'} · ${b.clock||'no data'}</span></div>${legs.map(b=>card(b,FLASH.has(pid(b)))).join('')}</div>`;
}
function burst(){
 const el=document.createElement('div');el.className='burst';
 ['💵','💸','🪙','💰','💵','🪙'].forEach((c,i)=>{const n=document.createElement('i');n.textContent=c;n.style.setProperty('--x',((i-2.5)*70)+'px');n.style.setProperty('--y',(-40-i*28)+'px');el.appendChild(n)});
 document.body.appendChild(el);setTimeout(()=>el.remove(),1000);
}
function R(d){
 LD=d;const bets=d.bets||[],live=bets.filter(b=>b.state==='in'),up=bets.filter(b=>b.state==='pre'),done=d.today||[];
 const openIds=new Set(bets.map(pid));
 if(OPENIDS)done.forEach(b=>{if(OPENIDS.has(pid(b)))FLASH.add(pid(b))});
 OPENIDS=openIds;
 const list=TAB==='Upcoming'?up:TAB==='Settled'?done:live;
 const blocks=TAB==='Settled'?(done.length?done.map(b=>{const w=b.result==='W';const fl=FLASH.has(pid(b))?(w?' flash-win':' flash-loss'):'';return `<div class="card${fl}"><div class="t">${PILL(b)} ${ttl(b)}</div><div class="meta"><b class="${w?'g':'r'}">${b.result||'no data'}</b> · ${money(b.result==='W'&&b.cash_out!=null&&b.cost!=null?b.cash_out-b.cost:b.result==='L'&&b.cost!=null?-b.cost:null)}</div></div>`}).join(''):'<div class="card">no data</div>'):(list.length?groups(list).map(gameBlock).join(''):'<div class="card">no data</div>');
 const op=openPnl(bets),tp=done.length?todayPnl(done):null,AT=d.all_time||{},all=AT.pnl!=null?AT.pnl:null,allTxt=(()=>{if(AT.pnl==null)return 'no data';const u=AT.units!=null?Number(AT.units):Math.round(AT.pnl/50*100)/100;const us=(u>0?'+':u<0?'−':'')+Math.abs(u).toFixed(2)+'u';return money(AT.pnl)+'<small style="display:block;font:700 14px/1.25 Inter,system-ui,sans-serif;margin-top:2px">'+us+' all-time</small>'})();
 const wins=new Set(done.filter(b=>b.result==='W').map(b=>b.bet));
 WINS=wins;SEEN=true;PREVCO={};(d.bets||[]).forEach(b=>{PREVCO[pid(b)]=b.cash_out});
 const O=d.official_record||{},BK=d.bucket_records||{};
 const buck=k=>{const r=BK[k]||{};if(!r.record||r.status==='no_data')return 'no data';return r.record+(r.pnl==null?' · P&L no data':' · '+money(r.pnl))};
 const cash=d.cash&&d.cash.value!=null?num(d.cash.value):'no data';
 const pos=d.balance&&d.balance.positions_value!=null?d.balance.positions_value:null;
 const cashV=d.cash&&d.cash.value!=null?d.cash.value:null;
 const bal=pos!=null?num(pos):'no data';
 const asof=(d.cash&&d.cash.as_of)||d.as_of||'no data';
 const eq=(cashV!=null&&pos!=null)?`${num(cashV+pos)} (${num(cashV)} cash + ${num(pos)} pos)`:'no data';
 const tabs=['Live','Upcoming','Settled'].map(t=>`<button class="${TAB===t?'on':''}" onclick="ST('${t}')">${t} ${t==='Settled'?done.length:t==='Upcoming'?up.length:live.length}</button>`).join('');
 document.getElementById('app').innerHTML=`<div class="brand"><img src="https://colemlrogalin-source.github.io/tv-home/icon-180.png?v=20261109c" alt="" onerror="this.remove()">★ SPORTS QUANT · POCKET ★</div>
<div class="upd">Updated ${asof} · ${eq}</div>
<div class="pair"><div><span>OPEN P&amp;L</span><b class="${op==null?'gold':op>=0?'g':'r'}">${money(op)}</b></div><div><span>TODAY</span><b class="${tp==null?'gold':tp>=0?'g':'r'}">${money(tp)}</b></div></div>
<div class="pair"><div><span>ALL-TIME</span><b class="${all==null?'gold':all>=0?'g':'r'}">${allTxt}</b></div><div><span>CASH</span><b class="gold">${cash}</b></div></div>
<div class="tabs">${tabs}</div>
<div class="panel cyan"><div class="hd"><b>${TAB.toUpperCase()} · ${list.length}</b><span>positions ${bal}</span></div>${blocks}</div>
<div class="panel pink">
<div class="stat"><span>📊 All Kalshi bets settled since Nov 9</span><b class="${O.pnl==null?'gold':O.pnl>=0?'g':'r'}">${O.record&&O.status!=='no_data'?O.record:'no data'}${O.pnl==null?'':' · '+money(O.pnl)}</b></div>
${(()=>{const L={official:'official picks',requested:'requested picks',"Cole's own":"Cole's own picks",'not taken':'not taken'};const ks=Object.keys(L).filter(k=>buck(k)!=='no data');return ks.length?`<div class="stat"><span style="opacity:.7">Pick log · tagged bets only (subset)</span><b></b></div>`+ks.map(k=>`<div class="stat"><span>${L[k]}</span><b>${buck(k)}</b></div>`).join(''):''})()}
<div class="stat"><span>${(d.archived_nov3_8&&d.archived_nov3_8.label)||'archived Nov 3-8'}</span><b class="gold">excluded</b></div>
</div>
<div class="foot">Updated ${asof}${O.source?' · '+O.source:''}</div>`;
}
function ST(t){TAB=t;if(LD)R(LD)}
async function go(){const MAC=!!window.pywebview;try{let r;const tryF=async(u,h)=>{try{const x=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),h);if(!x.ok)throw 0;return x}catch(e){return null}};const raw={cache:'no-store'},api={headers:{Accept:'application/vnd.github.raw'},cache:'no-store'};if(MAC){r=await tryF(RAW,raw)}if(!r)r=await tryF(RAW_FEED,raw);if(!r)r=await tryF(U_FEED,api);if(!r)r=await tryF(RAW,raw);if(!r)r=await fetch(U+(U.includes('?')?'&':'?')+'t='+Date.now(),api);
const d=await r.json();R(d);}
catch(e){document.getElementById('app').textContent='offline – retrying'}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')go()});
window.addEventListener('pageshow',e=>{if(e.persisted)go()});
go();
</script></body></html>
